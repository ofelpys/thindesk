<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar chamado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container mt-4">
    <h1 class="mb-4">Editar chamado</h1>

    <form th:action="@{/chamados/atualizar/{id}(id=${chamado.id})}"
          th:object="${chamado}" method="post">

        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição</label>
            <input type="text" id="descricao" th:field="*{descricao}"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" th:field="*{status}" class="form-select">
                <option value="ABERTO">Aberto</option>
                <option value="EM_ANDAMENTO">Em andamento</option>
                <option value="CONCLUIDO">Concluído</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="tipo" class="form-label">Tipo</label>
            <input type="text" id="tipo" th:field="*{tipo}"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="tecnico" class="form-label">Técnico</label>
            <input type="text" id="tecnico" th:field="*{tecnico}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label for="usuario" class="form-label">Usuário</label>
            <input type="text" id="usuario" th:field="*{usuario}"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="consideracoesTecnicas" class="form-label">
                Considerações técnicas
            </label>
            <textarea id="consideracoesTecnicas"
                      th:field="*{consideracoesTecnicas}"
                      class="form-control" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Salvar alterações</button>
        <a th:href="@{/chamados}" class="btn btn-secondary">Voltar</a>
    </form>
</main>
</body>
</html>
