<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<aside>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
</aside>

<div class="toggle-btn btn btn-dark d-md-none">
    <span>&#9776;</span>
</div>

<main class="container mt-4" th:fragment="content">
    <h2 class="mb-4">Lista de Chamados</h2>

    <form th:action="@{/chamados}" method="post" class="row g-3 mb-4">
        <div class="col-md-6">
            <label for="descricao" class="form-label">Descrição</label>
            <input id="descricao" name="descricao" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label for="tipo" class="form-label">Tipo</label>
            <input id="tipo" name="tipo" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label for="tecnico" class="form-label">Técnico</label>
            <input id="tecnico" name="tecnico" class="form-control">
        </div>

        <div class="col-md-6">
            <label for="usuario" class="form-label">Usuário</label>
            <input id="usuario" name="usuario" class="form-control" required>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Cadastrar chamado</button>
        </div>
    </form>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Descrição</th>
            <th>Status</th>
            <th>Tipo</th>
            <th>Técnico</th>
            <th>Usuário</th>
            <th>Considerações técnicas</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(chamados)}">
            <td colspan="7" class="text-center text-muted">
                Nenhum chamado cadastrado ainda.
            </td>
        </tr>
        <tr th:each="chamado : ${chamados}">
            <td th:text="${chamado.descricao}"></td>
            <td th:text="${chamado.status}"></td>
            <td th:text="${chamado.tipo}"></td>
            <td th:text="${chamado.tecnico}"></td>
            <td th:text="${chamado.usuario}"></td>
            <td th:text="${chamado.consideracoesTecnicas != null ? chamado.consideracoesTecnicas : '-'}"></td>
            <td>
                <a th:href="@{/chamados/atualizar/{id}(id=${chamado.id})}"
                   class="btn btn-sm btn-outline-primary">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
